name: Deployment
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
jobs:
  build:
    runs-on: self-hosted
    environment: development
    steps:
      - uses: actions/checkout@v4
      - run: |
          touch .env
          echo DATABASE_URL="${{ secrets.DATABASE_URL }}" >> .env
          echo MQTT_ENABLED="true" >> .env
          echo MQTT_HOST="${{ secrets.MQTT_HOST }}" >> .env
          echo MQTT_PORT="${{ secrets.MQTT_PORT }}" >> .env
          echo MQTT_USER="${{ secrets.MQTT_USER }}" >> .env
          echo MQTT_PASSWORD="${{ secrets.MQTT_PASSWORD }}" >> .env
          echo MQTT_TOPIC="${{ secrets.MQTT_TOPIC }}" >> .env
          IMAGE="${{ secrets.CONTAINER_IMAGE }}:${{ secrets.CONTAINER_TAG }}"
          NAME="${{ secrets.CONTAINER_NAME }}"

          docker stop "$NAME" || true
          docker rm --force "$NAME" || true
          docker rmi --force "$IMAGE" || true

          docker build . -t "$IMAGE" --progress=plain
          docker run --env-file .env -p 3000:3000 --name "$NAME" --restart unless-stopped -d "$IMAGE"
