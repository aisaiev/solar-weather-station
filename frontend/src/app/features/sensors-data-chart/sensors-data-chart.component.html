<z-card zTitle="Historical Data">
  <div class="flex flex-col gap-4">
    <app-sensor-type-tabs (selectedChange)="onSensorTypeChange($event)" />
    <div class="flex flex-wrap items-center gap-3">
      <app-period-select (selectedChange)="onPeriodChange($event)" />
      @if (isCustomMode()) {
        <z-date-picker
          placeholder="From"
          [value]="dateFrom()"
          zFormat="MMM d, yyyy"
          [maxDate]="dateTo()"
          (dateChange)="onDateFromChange($event)"
        />
        <z-date-picker
          placeholder="To"
          [value]="dateTo()"
          zFormat="MMM d, yyyy"
          [minDate]="dateFrom()"
          (dateChange)="onDateToChange($event)"
        />
      }
    </div>
    <div class="relative h-72">
      @if (isLoading()) {
        <z-skeleton class="h-full w-full rounded-lg" />
      } @else {
        <canvas
          baseChart
          type="line"
          [data]="chartJsData()"
          [options]="chartOptions()"
          [plugins]="chartPlugins"
        ></canvas>
      }
    </div>
  </div>
</z-card>
